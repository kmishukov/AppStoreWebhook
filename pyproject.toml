[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appstore-webhook"
version = "1.1.1"
description = "FastAPI service for receiving App Store Server Notifications V2 and forwarding subscription alerts to Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Konstantin Mishukov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "app-store-server-library>=3.1.2,<4",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=43.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot==22.5",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/kmishukov/AppStoreWebhook"
Issues = "https://github.com/kmishukov/AppStoreWebhook/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"
