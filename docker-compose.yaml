services:
  api:
    build: .
    container_name: appstore_webhook_api
    # env_file:
    #   - .env

    ports:
      - "127.0.0.1:8001:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s