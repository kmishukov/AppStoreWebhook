name: One-off widget format

on:
  push:
    branches:
      - feature/telegram-widgets
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-widgets
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format Python files
        run: |
          python -m pip install ruff
          ruff format app/tg/widget.py tests/test_widget.py

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/tg/widget.py tests/test_widget.py
          if ! git diff --cached --quiet; then
            git commit -m "Format widget implementation with Ruff"
            git push origin HEAD:feature/telegram-widgets
          fi
